<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enotrium Syndicate</title>
  <meta name="description" content="Enotrium Syndicate — Applied AI Lab for Autonomous Systems">
  <link rel="icon" type="image/png" href="EnotriumWhiteLogo.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Iceland&display=swap');

    :root {
      --bg: #0a0a0a;
      --text: #f0f0f0;
      --accent: #00ff9d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 40px;
      z-index: 100;
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid #222;
    }

    .menu-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
    }

    .menu-toggle span {
      width: 25px;
      height: 2px;
      background: white;
      transition: all 0.3s;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 60px;
      bottom: 0;
      width: 280px;
      background: #111;
      border-right: 1px solid #222;
      padding: 40px 30px;
      display: flex;
      flex-direction: column;
    }

    .logo img {
      height: 60px;
      filter: brightness(1.2);
    }

    .sidebar-links {
      margin-top: 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar-links a {
      color: #aaa;
      text-decoration: none;
      font-size: 15px;
      transition: color 0.3s;
    }

    .sidebar-links a:hover {
      color: var(--accent);
    }

    main {
      margin-left: 280px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 40px;
    }

    .hero {
      max-width: 800px;
    }

    .hero-title {
      font-family: 'Iceland', sans-serif;
      font-size: 6.5rem;
      line-height: 1;
      margin-bottom: 20px;
      background: linear-gradient(90deg, #fff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 1.4rem;
      color: #aaa;
      letter-spacing: 0.05em;
    }

    footer {
      position: fixed;
      bottom: 40px;
      left: 320px;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
      line-height: 1.8;
    }

    footer a {
      color: #999;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--accent);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar {
        display: none;
      }
      main {
        margin-left: 0;
      }
      .menu-toggle {
        display: flex;
      }
      footer {
        left: 40px;
      }
    }
  </style>
</head>
<body>
  <!-- Topbar -->
  <header class="topbar">
    <div class="menu-toggle" onclick="toggleMenu()">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </header>

  <!-- Left Sidebar -->
  <aside class="sidebar">
    <div class="logo">
      <img src="EnotriumWhiteLogo.png" alt="Enotrium Syndicate">
    </div>
    <nav class="sidebar-links">
      <a href="https://enotrium.org" target="_blank" rel="noopener">enotrium.org</a>
      <a href="https://github.com/Enotrium" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </aside>

  <main>
    <!-- Hero -->
    <div class="hero">
      <h1 class="hero-title">Enotrium</h1>
      <h1 class="hero-title" style="margin-top: -30px; font-size: 5.5rem;">Syndicate</h1>
      <p class="hero-subtitle">World AI</p>
    </div>
  </main>

  <footer>
    <a href="https://enotrium.org" target="_blank" rel="noopener">enotrium.org</a><br>
    © Enotrium Syndicate
  </footer>

  <script>
    function toggleMenu() {
      alert("Menu would appear here on mobile (single page only)");
      // You can expand this later if you want a mobile menu
    }
  </script>
</body>
</html>
